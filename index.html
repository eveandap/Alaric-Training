.adaptiveCard{border-left:6px solid var(--blue);background:linear-gradient(135deg,#eef7ff,#ffffff)}.adaptiveTitle{font-weight:1000;color:var(--navy);font-size:1.08rem;margin:4px 0}.adaptiveList{margin:8px 0 0 18px;padding:0;color:#334a5f}.adaptiveList li{margin:4px 0}.adaptiveNote{margin-top:5px;color:#0d5a35;font-weight:900;font-size:.82rem;background:var(--greenbg);border-radius:999px;padding:5px 8px;display:inline-block}.adaptiveNote.down{color:#7f1024;background:var(--redbg)}
.energy{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}.energy button{background:#edf3f8;color:#24384a;border:1px solid var(--line);padding:8px 11px}.energy button.active{background:var(--blue);color:white}.equipmentGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.equip{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);background:#f8fbfe;border-radius:12px;padding:7px 9px;min-height:42px}input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue)}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}.step{text-align:center;border:1px solid var(--line);border-radius:16px;background:white;padding:12px}.step .circle{width:42px;height:42px;border-radius:50%;margin:0 auto 7px;display:grid;place-items:center;border:3px solid #c9d2dd;color:var(--navy);font-weight:1000}.step.done .circle{background:var(--green);border-color:var(--green);color:white}.step.active .circle{background:var(--red);border-color:var(--red);color:white}

.badgeGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.badge{border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center;background:#fff}.badge.locked{opacity:.55;filter:grayscale(.4)}.badgeCoin{width:94px;height:94px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:radial-gradient(circle,#fff7d7,#d9a441 68%,#6b4019);border:5px solid #102a4d;box-shadow:inset 0 0 0 4px #fff1b3,0 4px 10px #0002}.badgeCoin svg{width:58px;height:58px}.assetCoin{background:none;border:0;box-shadow:none}.assetCoin img{width:118px;height:135px;object-fit:contain;display:block}.timeline{display:grid;gap:12px}.timelineItem{border-left:5px solid var(--red);background:white;border-radius:14px;padding:12px 14px;box-shadow:0 2px 8px #0000000a}.calMonth{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:white;margin-bottom:12px}.calMonth h3{background:#eaf5fb;margin:0;padding:12px}.calDays{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px}.dayBtn{background:#f8fbfe;color:var(--text);border:1px solid var(--line);text-align:left;min-height:92px}.dayBtn.done{background:var(--greenbg);border-color:#90c5a9}.dayBtn.selected{outline:3px solid #99c1e2}.dayBtn.school{background:#fff8e5}.table{width:100%;border-collapse:collapse;font-size:.92rem}.table th,.table td{border-bottom:1px solid #edf2f6;padding:9px 7px;text-align:left;vertical-align:top}.table th{background:#eef6fb;color:var(--navy)}.profileCard{background:linear-gradient(135deg,#102a4d,#071d3d);color:white;border:6px solid var(--gold);border-radius:24px;padding:20px;text-align:center}.profileCard .number{font-size:5rem;color:#f7d27a;font-weight:1000;line-height:.9}.profileCard h2{color:white;text-transform:uppercase;letter-spacing:.08em}

function seededNumber(str){
  let h=2166136261;
  for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}
  return h>>>0;
}
function seededShuffle(arr,seed){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=seededNumber(seed+"|"+i)%(i+1);
    const tmp=a[i];a[i]=a[j];a[j]=tmp;
  }
  return a;
}
function buildInterleavedQuotePool(quotes){
  const groups={};
  quotes.forEach((q,idx)=>{
    const key=q.author||("Unknown "+idx);
    if(!groups[key]) groups[key]=[];
    groups[key].push(q);
  });
  const authorGroups=Object.keys(groups).map(author=>({
    author,
    items:seededShuffle(groups[author],"ap-quote-items|"+author),
    tie:seededNumber("ap-quote-author|"+author)
  }));
  const out=[];
  let lastAuthor="";
  const total=quotes.length;
  while(out.length<total){
    let candidates=authorGroups.filter(g=>g.items.length&&g.author!==lastAuthor);
    if(!candidates.length) candidates=authorGroups.filter(g=>g.items.length);
    candidates.sort((a,b)=>{
      if(b.items.length!==a.items.length) return b.items.length-a.items.length;
      return seededNumber("ap-quote-round|"+out.length+"|"+a.author)-seededNumber("ap-quote-round|"+out.length+"|"+b.author);
    });
    const pick=candidates[0];
    out.push(pick.items.shift());
    lastAuthor=pick.author;
  }
  return out;
}

function hasStatus(rec,field,words){let v=String(rec?.[field]||"").toLowerCase();return words.some(w=>v===w||v.includes(w))}
function foodWaterWarning(rec){
  let notes=[];
  let food=String(rec?.food||"").trim(),water=String(rec?.water||"").trim();
  if(rec&&(food||water)){
    if(!food)notes.push("Fueling note: food was not logged yet.");

  }
  return notes;
}
function adaptivePlanFor(d,h,rec={}){
  let prior=findPreviousSimilarWorkout(d,h),pct=0,reasons=[],warnings=[];
  if(!prior){reasons.push("No prior similar saved workout yet. Follow the base workout today.");}
  else{
    let pr=h[prior.iso]||{},diff=Number(pr.difficulty||3),comp=String(pr.completion||"").toLowerCase();
    let label=`Last similar workout: ${niceDate(prior.iso)}.`;
    if(comp.includes("partial")){pct=-10;reasons.push(`${label} It was partially completed, so today uses a lighter eligible-rep target.`);}
    else if(diff>=5){pct=-10;reasons.push(`${label} It was rated max effort, so today uses a lighter eligible-rep target.`);}
    else if(hasStatus(pr,"arm",["hurts"])||hasStatus(pr,"legs",["hurts"])){pct=-10;reasons.push(`${label} Body check showed pain, so today protects volume.`);}
    else if(diff<=2 && comp.includes("completed everything") && !hasStatus(pr,"arm",["sore","hurts"]) && !hasStatus(pr,"legs",["sore","hurts"])){pct=10;reasons.push(`${label} It was completed and rated easy/manageable, so today adds +10% to eligible controlled skill reps.`);}
    else if(diff===4){reasons.push(`${label} It was rated hard. Stay with the base workout today.`);}
    else if(comp.includes("mostly")){reasons.push(`${label} It was mostly completed. Stay with the base workout today.`);}
    else{reasons.push(`${label} Stay with the base workout today.`);}
  }
  if(hasStatus(rec,"arm",["hurts"])){pct=Math.min(pct,0);warnings.push("Arms marked Hurts: do not add arm-heavy or throwing volume today.");}
  else if(hasStatus(rec,"arm",["sore"])){pct=Math.min(pct,0);warnings.push("Arms marked Sore: keep reps clean and controlled; no added arm volume.");}
  if(hasStatus(rec,"legs",["hurts"])){pct=Math.min(pct,0);warnings.push("Legs marked Hurts: do not add lower-leg, speed, or agility volume today.");}
  else if(hasStatus(rec,"legs",["sore"])){pct=Math.min(pct,0);warnings.push("Legs marked Sore: keep movement quality controlled; no added lower-body volume.");}
  let energy=Number(rec?.energy||0);
  if(energy&&energy<=2){warnings.push("Low energy check-in: hydrate, fuel, and keep quality higher than speed.");}
  warnings.push(...foodWaterWarning(rec));
  return {pct,reasons,warnings,priorIso:prior?.iso||""};
}

function adaptiveEligibleRow(r,b,d){

}
function adaptiveAdjustedTargetText(target,pct){
  let t=String(target||"");
  let range=t.match(/(\d+)\s*-\s*(\d+)\s*(swings|clean reps|reps|transfers)/i);
  if(range){
    let a=Math.max(1,Math.round(Number(range[1])*(1+pct/100))),b=Math.max(a,Math.round(Number(range[2])*(1+pct/100)));
    return t.replace(range[0],`${a}-${b} ${range[3]}`);
  }
  let m=t.match(/(\d+)\s*(swings|clean reps|reps|transfers)/i);
  if(!m)return "";
  let n=Number(m[1]),adj=Math.max(1,pct>0?Math.ceil(n*(1+pct/100)):Math.round(n*(1+pct/100)));
  if(adj===n)return "";
  return t.replace(m[0],`${adj} ${m[2]}`);
}
function adaptiveNoteForRow(r,b,d,plan){

  if(!adjusted)return "";

}

function collectWorkoutResults(d){
  const inputs=[...document.querySelectorAll('[data-key]')],workoutResults={};
  inputs.forEach(el=>{workoutResults[el.dataset.key]=el.type==="checkbox"?!!el.checked:(el.value||"")});
  const exerciseSummary=[];
  (d.blocks||[]).forEach((b,bi)=>(b.rows||[]).forEach((r,ri)=>{
    const key=`b${bi}r${ri}`,item={block:b.title,name:r.name,target:r.target,type:r.type||"check"};
    if(r.type==="sets"){
      const total=Number(r.count)||0,sets=Array.from({length:total},(_,i)=>!!workoutResults[`${key}s${i+1}`]);
      item.completedSets=sets.filter(Boolean).length;item.totalSets=total;item.completed=total>0&&sets.every(Boolean);item.sets=sets;
    }else if(r.type==="score"){
      item.score=String(workoutResults[`${key}score`]||"").trim();item.completed=!!item.score;
    }else{
      item.completed=!!workoutResults[`${key}done`];
    }
    exerciseSummary.push(item);
  }));
  return {workoutResults,exerciseSummary};
}

function wallBallEligible(d){
  if(!d||d.iso!==TODAY_ISO||d.mode==="placeholder"||wallBallDismissedToday(d.iso)||wallBallCompletedToday(d.iso))return false;
  let h=loadHistory(),rec=h[d.iso]||{};
  if(hasStatus(rec,"arm",["hurts"]))return false;
  let dow=dayName(d.iso),score=wallBallOfferScore(d.iso);
  if(dow==="Thursday")return false;
  if(dow==="Tuesday")return score<75;
  if(dow==="Friday")return score<60;
  if(d.mode==="weekend")return score<45;
  if(d.mode==="school_training"||d.mode==="early_release")return score<35;
  if(dow==="Monday"||dow==="Wednesday")return score<25;
  return score<18;
}
function renderWallBallCard(d){
  if(!wallBallEligible(d)&&!wallBallCompletedToday(d.iso))return "";
  let count=wallBallCompletedCount(),best=wallBallBestStreak(),done=wallBallCompletedToday(d.iso);
  return `<div class="card wallBallCard"><div class="blockTitle"><h3>Optional Bonus Challenge</h3><span class="chip gold">Brick Wall</span></div>
    <p><b>${done?"Challenge saved today.":"Wall Ball Challenge available."}</b> Quick hands, clean catches, and a 60-second timer. This is optional and does not affect workout completion.</p>
    <div class="brickStats"><div><small>Challenges</small><b>${count}</b></div><div><small>Best Streak</small><b>${best}</b></div><div><small>Today</small><b>${done?"Done":"Open"}</b></div></div>
    <div class="row"><button class="gold" onclick="openWallBallChallenge('${d.iso}')">${done?"Play Again":"Play Challenge"}</button><button class="secondary" onclick="dismissWallBallToday('${d.iso}')">Not Today</button></div>
    <p class="small">Use a safe wall, enough space, and a tennis ball if a baseball is too loud or risky. Brick Wall challenge history saves, but badge unlocks are paused for launch.</p></div>`;
}
function maybeShowWallBallOffer(d){

function startWallBallTimer(){
  clearInterval(wallBallTimerId);
  wallBallSecondsLeft=60;
  let timer=document.getElementById("wallBallTimer"),start=document.getElementById("wallBallStart"),save=document.getElementById("wallBallSave"),fields=document.getElementById("wallBallScoreFields");
  if(start)start.disabled=true;
  if(timer)timer.textContent=wallBallSecondsLeft;
  wallBallTimerId=setInterval(()=>{
    wallBallSecondsLeft--;
    if(timer)timer.textContent=wallBallSecondsLeft;
    if(wallBallSecondsLeft<=0){
      clearInterval(wallBallTimerId);
      if(timer)timer.textContent="Done";
      fields?.classList.add("active");
      document.getElementById("wallBallScoreHelp")?.removeAttribute("style");
      if(save)save.disabled=false;
    }
  },1000);
}
function saveWallBallChallenge(iso=TODAY_ISO){
  let total=Number(document.getElementById("wallBallTotal")?.value||0),streak=Number(document.getElementById("wallBallStreak")?.value||0);
  if(total<0||streak<0||!Number.isFinite(total)||!Number.isFinite(streak)){alert("Enter valid catch numbers.");return}
  if(streak>total){alert("Best streak cannot be higher than total catches.");return}
  let mode=document.querySelector('input[name="wallBallMode"]:checked')?.value||"Rookie Wall";
  let list=loadWallBallHistory();
  list.push({iso,mode,durationSeconds:60,totalCatches:Math.round(total),bestStreak:Math.round(streak),completed:true,savedAt:new Date().toISOString()});
  saveWallBallHistory(list);
  localStorage.setItem(WALL_BALL_DISMISS_KEY+iso,"1");
  clearInterval(wallBallTimerId);
  document.getElementById("wallBallOverlay")?.remove();
  maybeUnlockBrickWall();
  alert("Brick Wall challenge saved.");
  renderToday();
}
function maybeUnlockBrickWall(){

  BRICK_WALL_TIERS.forEach((req,i)=>{
    let name=`Brick Wall ${["I","II","III","IV","V"][i]}`;
    if(!newBadge&&count>=req&&!earnedNames.has(name)){
      newBadge={name,earnedDate:TODAY_ISO,asset:"badges/brick-wall.png",desc:`Completed ${req} optional wall ball challenges.`};
      earned.push(newBadge);
    }
  });
  if(newBadge){localStorage.setItem("apb_earned_badges",JSON.stringify(earned));showUnlock(newBadge);}
}

function getNotifySettings(){
  return JSON.parse(localStorage.getItem("ap_parent_notify_settings") || '{"started":true,"completed":true}');
}
function saveNotifySettings(){
  const started = document.getElementById("notifyStarted")?.checked ?? true;
  const completed = document.getElementById("notifyCompleted")?.checked ?? true;
  localStorage.setItem("ap_parent_notify_settings", JSON.stringify({started, completed}));window.AP_SYNC?.queueSync?.("notify-settings-save");
  alert("Parent alert settings saved.");
}
function hydrateNotifySettings(){
  const s = getNotifySettings();
  if(document.getElementById("notifyStarted")) document.getElementById("notifyStarted").checked = !!s.started;
  if(document.getElementById("notifyCompleted")) document.getElementById("notifyCompleted").checked = !!s.completed;
}
async function testParentNotification(){
  if("Notification" in window && Notification.permission !== "granted"){
    try { await Notification.requestPermission(); } catch(e) {}
  }
  if("Notification" in window && Notification.permission === "granted"){
    new Notification("AP Baseball", { body: "Test alert: parent alerts are ready on this device." });
  } else {
    alert("Notifications are not enabled on this device yet.");
  }
}
async function parentNotify(type, iso, payload){
  const settings = getNotifySettings();
  if(type === "started" && !settings.started) return;
  if(type === "completed" && !settings.completed) return;

  const day = allTrainingDays().find(d => d.iso === iso);
  const title = type === "started" ? "Workout Started" : "Workout Complete";
  const body = type === "started"
    ? `Alaric started ${day ? niceDate(day.iso) : iso}. Walk-Up: ${day?.song?.[0] || ""}`
    : `Alaric finished ${day ? niceDate(day.iso) : iso}. Duration: ${payload?.durationMinutes || "--"} min. Difficulty: ${payload?.difficulty || "--"}/5.`;

  if(window.AP_NOTIFY && typeof window.AP_NOTIFY.sendEvent === "function"){
    try { await window.AP_NOTIFY.sendEvent({ type, iso, title, body, payload }); } catch(e) { console.warn(e); }
  }

  if("Notification" in window && Notification.permission === "granted"){
    try { new Notification("AP Baseball: " + title, { body }); } catch(e) {}
  }
}

  overlay.className='coinIntroOverlay';
  overlay.innerHTML=`<div class="coinIntroBackdrop"></div>
    <span class="coinIntroSpark s1"></span><span class="coinIntroSpark s2"></span><span class="coinIntroSpark s3"></span><span class="coinIntroSpark s4"></span>
    <div class="coinIntroModelWrap">
      <model-viewer id="coinIntroModel" class="coinIntroModel" src="${COIN_INTRO_MODEL}" alt="Adaptive Performance coin" touch-action="none" disable-pan disable-zoom interaction-prompt="none" camera-orbit="0deg 90deg 4.9m" camera-target="0m 0m 0m" field-of-view="36deg" min-field-of-view="30deg" max-field-of-view="46deg" exposure="1.02" shadow-intensity=".5" environment-image="neutral" reveal="auto"></model-viewer>
    </div>
    <div class="coinIntroBottom">
      <div class="coinIntroProgress"><span></span></div>
    </div>`;
  document.body.appendChild(overlay);
  let model=overlay.querySelector('#coinIntroModel');
  let done=false;
  let finish=()=>{
    if(done) return;
    done=true;
    overlay.style.transition='opacity .45s ease';
    overlay.style.opacity='0';
    setTimeout(dismissCoinIntro,460);
  };
  let animate=()=>{
    if(!model) { setTimeout(finish,1500); return; }
    let start=null;
    let frontHold=2000, spinDuration=850, backHold=2500;
    function easeInOutCubic(x){ return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; }
    function frame(ts){
      if(!start) start=ts;
      let elapsed=ts-start;
      let angle=0;
      if(elapsed<frontHold){
        angle=0;
      } else if(elapsed<frontHold+spinDuration){
        let p=(elapsed-frontHold)/spinDuration;
        let eased=easeInOutCubic(Math.max(0,Math.min(1,p)));
        angle=180*eased;
      } else {
        angle=180;
      }
      model.setAttribute('camera-orbit', `${angle.toFixed(1)}deg 90deg 5.0m`);
      if(elapsed<frontHold+spinDuration+backHold) requestAnimationFrame(frame);
      else finish();
    }
    requestAnimationFrame(frame);
  };
  if(model){
    model.addEventListener('load', ()=>{ model.classList.add('ready'); setTimeout(animate,650); }, {once:true});
    model.addEventListener('error', ()=>{ setTimeout(finish,1800); }, {once:true});
  } else {
    setTimeout(finish,1000);
  }
  setTimeout(finish,5850);
}

  if(localStorage.getItem(COIN_INTRO_DAY_KEY)===TODAY_ISO) { window.AP_COIN_INTRO_ACTIVE=false; document.documentElement.classList.remove('intro-pending'); return; }
  showCoinIntro();
}
