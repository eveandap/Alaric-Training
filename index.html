const APP=JSON.parse(document.getElementById('appData').textContent),DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday'],TABS=['Today','Calendar','Weekly Overview','Definitions & How-To','Video Library','Progress History'];let selectedWeek=1,selectedDay='Monday',activeTab='Today';const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],keyDay=()=>`alaric.day.w${selectedWeek}.${selectedDay}`,keyWeek=(w=selectedWeek)=>`alaric.week.w${w}`,gkey='alaric.global.v3';function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function load(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function currentDay(){return APP.days.find(d=>d.week==selectedWeek&&d.day===selectedDay)}function currentWeek(){return APP.weeks[String(selectedWeek)]||APP.weeks[selectedWeek]}function setBtns(c,v){$$('button',c).forEach(b=>b.classList.toggle('active',b.dataset.value===v))}function getBtn(c){let b=$('button.active',c);return b?b.dataset.value:''}function vlink(k){if(!k||!APP.videos[k])return'';let v=APP.videos[k];return`<a class="videoBtn" href="${v.url}" target="_blank" rel="noopener">Video</a>`}function todayDefault(){let start=new Date(2026,4,25),now=new Date(),diff=Math.floor((now-start)/(1000*60*60*24));if(diff>=0&&diff<75){let wk=Math.floor(diff/7)+1,dow=diff%7;if(wk>=1&&wk<=11&&dow<5){selectedWeek=wk;selectedDay=DAYS[dow]}}}function initTabs(){let t=$('#tabs');t.innerHTML='';TABS.forEach(name=>{let b=document.createElement('button');b.className='tab'+(name===activeTab?' active':'');b.textContent=name;b.onclick=()=>{if(name==='Today')todayDefault();activeTab=name;render()};t.appendChild(b)})}function render(){initTabs();['today','calendar','weekly','guide','videos','history'].forEach(v=>$('#view-'+v).classList.add('hidden'));let id={'Today':'today','Calendar':'calendar','Weekly Overview':'weekly','Definitions & How-To':'guide','Video Library':'videos','Progress History':'history'}[activeTab];$('#view-'+id).classList.remove('hidden');$('#dailyFooter').style.display=activeTab==='Today'?'flex':'none';if(activeTab==='Today')renderToday();if(activeTab==='Calendar')renderCalendar();if(activeTab==='Weekly Overview')renderWeekly();if(activeTab==='Definitions & How-To')renderGuide();if(activeTab==='Video Library')renderVideos();if(activeTab==='Progress History')renderHistory()}function selectors(){return`<div class="card"><div class="grid2"><div><label>Week</label><select id="weekSel">${Object.values(APP.weeks).map(w=>`<option value="${w.week}" ${w.week==selectedWeek?'selected':''}>Week ${w.week}: ${esc(w.phase)}</option>`).join('')}</select></div><div><label>Day</label><select id="daySel">${DAYS.map(d=>`<option value="${d}" ${d===selectedDay?'selected':''}>${d}</option>`).join('')}</select></div></div></div>`}function attachSelectors(root=document){$('#weekSel',root).onchange=e=>{selectedWeek=Number(e.target.value);render()};$('#daySel',root).onchange=e=>{selectedDay=e.target.value;render()}}function renderToday(){let d=currentDay(),s=load(keyDay()),g=load(gkey),ready=checkinComplete(s);$('#view-today').innerHTML=selectors()+`<section class="card"><div class="row between"><span class="chip">${esc(d.phase)}</span><span class="small">${esc(d.dates)} • PDF p.${d.page}</span></div><h2 style="margin:.5rem 0 .25rem">${esc(d.title)}</h2><p class="small">Weekly target: ${esc(d.weekTarget)} Friday goal: ${esc(d.weekFridayGoal)}.</p><div class="progressbar"><span id="bar"></span></div><div class="small" id="progressText"></div></section><section class="card"><h3>Alaric's Athlete Check-In</h3><label>Energy</label><div class="row energy" id="energyBtns">${[1,2,3,4,5].map(n=>`<button type="button" data-value="${n}">${n}</button>`).join('')}</div><p class="small">1 = low energy. 5 = ready to go. Be honest.</p><div class="grid3"><div><label>Arm</label><div class="pill" data-field="arm">${['Good','Tired','Hurts'].map(x=>`<button type="button" data-value="${x}">${x}</button>`).join('')}</div></div><div><label>Legs</label><div class="pill" data-field="legs">${['Good','Tired','Hurts'].map(x=>`<button type="button" data-value="${x}">${x}</button>`).join('')}</div></div><div><label>Mood</label><select id="mood"><option value="">Choose mood</option>${['Locked in','Motivated','Focused','Confident','Calm','Competitive','Okay','Tired','Frustrated','Distracted','Not feeling it','Proud'].map(x=>`<option ${s.mood===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="grid2" style="margin-top:10px"><div><label>What did you eat today?</label><input id="food" value="${esc(s.food||s.fuel||'')}" placeholder="Example: eggs, turkey sandwich, banana, yogurt"></div><div><label>How much water have you had today?</label><input id="water" value="${esc(s.water||'')}" placeholder="Example: 2 bottles, 3 cups, or half gallon"></div></div><div class="grid2" style="margin-top:10px"><div><label>Today's focus</label><input id="focusInput" value="${esc(s.focusInput||'')}" placeholder="Example: Hit line drives and pace myself"></div><div><label>Looking forward to</label><input id="look" value="${esc(s.look||'')}" placeholder="Example: Hitting work, getting faster, or finishing strong"></div></div><div style="margin-top:10px"><label>What do you need from Mom/Dad today?</label><input id="need" value="${esc(s.need||'')}" placeholder="Example: Help setting up the net, snack/water, watch a drill, ride, or nothing today"></div></section><section id="checkinGate" class="card lockedCard ${ready?'hidden':''}"><h3>Complete Check-In First</h3><p class="small">Answer every athlete check-in question above before moving into the workout. For Mom/Dad support, write “nothing today” if you do not need anything.</p><p class="small" id="missingFields"></p></section><div id="afterCheckin" class="${ready?'':'hidden'}"><section class="card"><h3>Before You Start: Equipment Check</h3><div class="equipGrid">${d.equipment.map((eq,i)=>`<label class="equipItem"><input type="checkbox" data-equip="${i}" ${s['equip_'+i]?'checked':''}>${esc(eq)}</label>`).join('')}</div></section><section class="card"><h3>Workout Timing</h3><div class="grid2"><div><label>Workout Start Time</label><input id="workoutStartTime" type="time" value="${esc(s.workoutStartTime||'')}"></div><div><label>Estimated Session Length</label><input id="estimatedSessionLength" value="${esc(s.workoutEstimatedDuration||'')}" placeholder="Calculated when results are sent" readonly></div></div><p class="small">Enter the start time before the workout. When results are sent, the app captures the send time and calculates an estimated session length.</p></section><section class="card quote"><b>Weekly Mindset - ${esc(d.quoteAuthor)}</b>“${esc(d.quote)}”</section><section class="card fact"><b>Did you know?</b>${esc(d.fact)}</section><section id="workoutBlocks">${d.blocks.map((b,bi)=>block(b,bi,s)).join('')}</section><section class="card"><h3>Finish / Notes</h3><div class="grid2"><div><label>Best rep or score today</label><input id="best" value="${esc(s.best||'')}" placeholder="Example: 16 clean short hops or best line-drive round"></div><div><label>One thing to improve</label><input id="improve" value="${esc(s.improve||'')}" placeholder="Example: Stay lower on ground balls"></div></div><div style="margin-top:10px"><label>Notes / Reminder for me or Mom/Dad</label><textarea id="notes" placeholder="Example: Arm felt good. Remind me to pack J-Bands.">${esc(s.notes||'')}</textarea></div></section><section class="card"><h3>Workout Difficulty</h3><label>How hard did this workout feel?</label><div class="row pill" data-field="workoutDifficulty">${['1 - Easy','2 - Manageable','3 - Challenging','4 - Hard','5 - Max Effort'].map(x=>`<button type="button" data-value="${x}">${x}</button>`).join('')}</div><p class="small">Rate the full session before sending results. This helps track whether the plan is building strength without becoming too much.</p></section><section class="card"><h3>Send Results</h3><p class="small">Rate the workout difficulty, save the day, then send the summary by email.</p><label>Parent email</label><input id="parentEmail" value="${esc(g.parentEmail||'')}" placeholder="Optional - enter Mom/Dad email once"></section></div>`;attachSelectors($('#view-today'));attachDaily();updateProgress()}function block(b,bi,s){return`<section class="card"><div class="blockTitle"><h3>${esc(b.title)}</h3><span class="chip">${esc(b.guide||'How-to')}</span></div>${b.note?`<div class="blockNote">${esc(b.note)}</div>`:''}<div>${b.rows.map((r,ri)=>rowHtml(r,bi,ri,s)).join('')}</div></section>`}function rowHtml(r,bi,ri,s){let base=`${bi}_${ri}`,controls='';if(r.type==='sets'){for(let i=1;i<=r.count;i++)controls+=`<label class="cb">Set ${i} <input type="checkbox" data-cb="${base}_${i}" ${s['cb_'+base+'_'+i]?'checked':''}></label>`}else if(r.type==='score'){controls=`<input class="scorebox" data-score="${base}" value="${esc(s['score_'+base]||'')}" placeholder="score">`}else{controls=`<label class="cb">Done <input type="checkbox" data-cb="${base}_1" ${s['cb_'+base+'_1']?'checked':''}></label>`;if(r.inputType)controls+=`<input class="scorebox" data-score="${base}" value="${esc(s['score_'+base]||'')}" placeholder="actual">`}return`<div class="exercise"><div class="exname">${esc(r.name)}</div><div class="desc">${targetLine(r)}<div class="cue">${esc(r.cue||'')}</div></div><div>${vlink(r.video)}</div><div class="sets">${controls}</div></div>`}function attachDaily(){let s=load(keyDay());setBtns($('#energyBtns'),s.energy||'');$$('.pill').forEach(p=>setBtns(p,s[p.dataset.field]||''));$$('#energyBtns button').forEach(b=>b.onclick=()=>{setBtns($('#energyBtns'),b.dataset.value);saveDay(false);updateWorkoutGate()});$$('.pill').forEach(p=>$$('button',p).forEach(b=>b.onclick=()=>{setBtns(p,b.dataset.value);saveDay(false);updateWorkoutGate()}));$$('input,textarea,select').forEach(el=>{el.oninput=()=>{saveDay(false);updateWorkoutGate()};el.onchange=()=>{if(el.matches('[data-cb]'))enforceSetLocks();saveDay(false);updateWorkoutGate();updateProgress()}});$('#saveBtn').onclick=()=>saveDay(true);$('#resetBtn').onclick=resetDay;$('#emailBtn').onclick=emailSummary;enforceSetLocks();updateWorkoutGate()}function enforceSetLocks(){let groups={};$$('[data-cb]').forEach(cb=>{let m=String(cb.dataset.cb||'').match(/^(.*)_(\d+)$/);if(!m)return;(groups[m[1]]??=[]).push(cb)});Object.values(groups).forEach(list=>{list.sort((a,b)=>Number(a.dataset.cb.split('_').pop())-Number(b.dataset.cb.split('_').pop()));if(list.length<2){list.forEach(cb=>{cb.disabled=false;cb.closest('.cb')?.classList.remove('disabledSet')});return}list.forEach((cb,i)=>{let allowed=i===0||list[i-1].checked;if(!allowed)cb.checked=false;cb.disabled=!allowed;cb.closest('.cb')?.classList.toggle('disabledSet',!allowed)})})}function requiredCheckinMissing(s){let labels={energy:'Energy',arm:'Arm',legs:'Legs',mood:'Mood',food:'What did you eat today?',water:'How much water have you had today?',focusInput:'Today\'s focus',look:'Looking forward to',need:'What do you need from Mom/Dad today?'};return Object.keys(labels).filter(k=>!String((s&&s[k])||'').trim()).map(k=>labels[k])}function checkinComplete(s){return requiredCheckinMissing(s).length===0}function updateWorkoutGate(){let after=$('#afterCheckin'),gate=$('#checkinGate'),missing=$('#missingFields');if(!after&&!gate)return;let s=collect(),miss=requiredCheckinMissing(s),ready=miss.length===0;if(after)after.classList.toggle('hidden',!ready);if(gate)gate.classList.toggle('hidden',ready);if(missing)missing.textContent=ready?'':'Still needed: '+miss.join(', ')}function collect(){let s=load(keyDay()),eb=$('#energyBtns');if(eb)s.energy=getBtn(eb);$$('.pill').forEach(p=>s[p.dataset.field]=getBtn(p));['mood','food','water','focusInput','look','need','best','improve','notes','workoutStartTime'].forEach(id=>{let el=$('#'+id);if(el)s[id]=el.value});let ad=adaptiveDecision(currentDay());s.adaptiveAdjustment=ad.status;s.adaptiveAdjustmentPercent=ad.pct;s.adaptiveAdjustmentReason=ad.reason;s.adaptiveAdjustmentSource=ad.source;$$('[data-equip]').forEach(cb=>s['equip_'+cb.dataset.equip]=cb.checked);$$('[data-cb]').forEach(cb=>s['cb_'+cb.dataset.cb]=cb.checked);$$('[data-score]').forEach(inp=>s['score_'+inp.dataset.score]=inp.value);s.savedAt=new Date().toISOString();return s}function saveDay(alertIt){if(activeTab!=='Today')return;save(keyDay(),collect());let g=load(gkey),pe=$('#parentEmail');if(pe){g.parentEmail=pe.value;save(gkey,g)}updateProgress();if(alertIt)alert('Saved. Nice work.')}function dayDone(s){return s&&Object.keys(s).some(k=>s[k])}function updateProgress(){let boxes=$$('[data-cb]'),done=boxes.filter(b=>b.checked).length,pct=boxes.length?Math.round(done/boxes.length*100):0;if($('#bar'))$('#bar').style.width=pct+'%';if($('#progressText'))$('#progressText').textContent=`${done} of ${boxes.length} checklist boxes complete (${pct}%).`}function resetDay(){if(confirm('Clear this day only?')){localStorage.removeItem(keyDay());render()}}function renderCalendar(){let by={};APP.days.forEach(d=>(by[d.week]??=[]).push(d));$('#view-calendar').innerHTML=`<section class="card"><h2>Calendar / Pick a Date</h2><p class="small">Tap a day to jump to that workout. Green days have saved progress.</p></section>`+Object.entries(by).map(([w,ds])=>`<div class="calendarWeek"><div class="calHead">Week ${w}: ${esc(APP.weeks[w].phase)} • ${esc(APP.weeks[w].dates)}</div><div class="calDays">${ds.map(d=>{let s=load(`alaric.day.w${d.week}.${d.day}`);return`<button class="${dayDone(s)?'done':''}" onclick="goDay(${d.week},'${d.day}')">${d.day}<br><span class="tiny">${esc(d.title.replace(/^.*?: /,''))}</span></button>`}).join('')}</div></div>`).join('')}function goDay(w,d){selectedWeek=w;selectedDay=d;activeTab='Today';render()}function renderWeekly(){let w=currentWeek(),s=load(keyWeek());$('#view-weekly').innerHTML=selectors()+`<section class="card"><h2>${esc(w.title)}</h2><div class="row between"><span class="chip">${esc(w.phase)}</span><span class="small">${esc(w.dates)}</span></div><p>${esc(w.target)}</p></section><section class="card quote"><b>Weekly Mindset - ${esc(w.author)}</b>“${esc(w.quote)}”</section><section class="card fact"><b>Did you know?</b>${esc(w.fact)}</section><section class="card"><h3>Week Setup Checklist</h3>${['Find the main tools for this week','Pick one skill focus','Circle practice/game conflicts','Choose one recovery target'].map((x,i)=>`<label class="equipItem"><input type="checkbox" data-wcb="${i}" ${s['wcb_'+i]?'checked':''}>${x}</label>`).join('')}</section><section class="card"><h3>Weekly Scoreboard</h3><div class="grid2">${['Contact score','Directional score','Fielding clean reps','Jump rope / agility','Arm feel'].map(x=>`<div><label>${x}</label><input data-wfield="${esc(x)}" value="${esc(s[x]||'')}"></div>`).join('')}</div></section><section class="card"><h3>Weekly Reflection</h3><label>One thing I want to sharpen this week</label><input data-wfield="sharpen" value="${esc(s.sharpen||'')}" placeholder="Example: Cleaner transfers or line drives"><label>One thing I did well last week</label><input data-wfield="didWell" value="${esc(s.didWell||'')}" placeholder="Example: Stayed focused during fielding"><label>Reminder for me or Mom/Dad</label><input data-wfield="weekReminder" value="${esc(s.weekReminder||'')}" placeholder="Example: Help me set up the net on hitting days"><div style="margin-top:10px"><button onclick="saveWeek(true)">Save Week</button></div></section>`;attachSelectors($('#view-weekly'));$$('[data-wcb],[data-wfield]').forEach(el=>{el.onchange=()=>saveWeek(false);el.oninput=()=>saveWeek(false)})}function saveWeek(a){let s={};$$('[data-wcb]').forEach(cb=>s['wcb_'+cb.dataset.wcb]=cb.checked);$$('[data-wfield]').forEach(inp=>s[inp.dataset.wfield]=inp.value);save(keyWeek(),s);if(a)alert('Week saved.')}function renderGuide(){$('#view-guide').innerHTML=`<section class="card"><h2>Definitions & How-To</h2><p class="small">Use this section when a drill or tool is unclear. Workout rows also have video buttons.</p></section><section class="card"><h3>Adaptive Rules</h3><table class="table ruleTable"><tr><th>Last similar workout rating</th><th>Next similar workout</th></tr><tr><td>1 - Easy</td><td>Increase volume by 10% only if 90%+ complete and Arm/Legs are not Tired or Hurts.</td></tr><tr><td>2 - Manageable</td><td>Increase volume by 5% only if 90%+ complete and Arm/Legs are not Tired or Hurts.</td></tr><tr><td>3 - Challenging</td><td>Use the normal listed plan.</td></tr><tr><td>4 - Hard</td><td>Repeat the same listed numbers.</td></tr><tr><td>5 - Max Effort</td><td>Reduce volume by 15%.</td></tr><tr><td>Arm/Legs Hurts</td><td>Reduce volume by 15%, even if the difficulty rating was low.</td></tr><tr><td>Under 80% complete</td><td>Repeat the same listed numbers. No increase.</td></tr></table><p class="small">The app applies this to the next same day-type workout, such as Monday to the next Monday or Wednesday to the next Wednesday.</p></section><section class="card"><h3>Tools Used</h3><table class="table"><tr><th>Category</th><th>Tools</th></tr>${APP.tools.map(t=>`<tr><td><b>${esc(t[0])}</b></td><td>${esc(t[1])}</td></tr>`).join('')}</table></section>`+APP.definitions.map(sec=>`<section class="card"><h3>${esc(sec.title)}</h3><table class="table"><tr><th>Item</th><th>How it helps / how to use it</th></tr>${sec.items.map(it=>`<tr><td><b>${esc(it[0])}</b></td><td>${esc(it[1])}</td></tr>`).join('')}</table></section>`).join('')}function renderVideos(){let groups=[['Hitting',['insider_bat','camwood','pro_velocity','speed_bat','one_hand_bat','half_paddle','perfect_swing','directional_tee']],['Fielding, Agility, Arm Care',['j_bands','towel_drill','short_hops','ground_ball','double_play_ss','double_play_2b','crossover','quick_feet']],['Tidal Tools, Strength, Mobility',['tidal_power','tidal_library','sphere_tank','basic_strength','reverse_lunge','lateral_lunge','glute_bridge','dead_bug','hip_flexor','thoracic','hip_9090','hollow_hold','jump_rope']]];$('#view-videos').innerHTML=`<section class="card"><h2>Video Reference Library</h2><p class="small">Tap a video only when a drill is unclear, then return to the workout.</p></section>`+groups.map(g=>`<section class="card"><h3>${g[0]}</h3><table class="table"><tr><th>Video</th><th>Open</th></tr>${g[1].map(k=>`<tr><td>${esc(APP.videos[k].title)}</td><td><a class="videoBtn" href="${APP.videos[k].url}" target="_blank" rel="noopener">Open video</a></td></tr>`).join('')}</table></section>`).join('')}function renderHistory(){let rows=[];APP.days.forEach(d=>{let s=load(`alaric.day.w${d.week}.${d.day}`);if(dayDone(s))rows.push({d,s})});$('#view-history').innerHTML=`<section class="card"><h2>Progress History</h2><p class="small">Saved workout days appear here. Data is stored locally on this device/browser.</p><div class="row"><span class="chip">${rows.length} saved day(s)</span><button class="secondary" onclick="copyHistory()">Copy History Summary</button></div></section>`+(rows.length?rows.map(r=>`<section class="card"><h3>Week ${r.d.week} • ${r.d.day}</h3><p><b>${esc(r.d.title)}</b></p><p class="small">Timing: ${esc(formatTimeInput(r.s.workoutStartTime)||'not entered')} → ${esc(r.s.workoutCompletedTime||'not sent')} • Estimated: ${esc(r.s.workoutEstimatedDuration||'not calculated')}</p><p class="small">Difficulty: ${esc(r.s.workoutDifficulty||'not rated')}</p><p class="small">Energy: ${esc(r.s.energy||'')} • Arm: ${esc(r.s.arm||'')} • Legs: ${esc(r.s.legs||'')} • Mood: ${esc(r.s.mood||'')}</p><p><b>Food:</b> ${esc(r.s.food||r.s.fuel||'')}</p><p><b>Water:</b> ${esc(r.s.water||'')}</p><p><b>Today’s focus:</b> ${esc(r.s.focusInput||'')}</p><p><b>Looking forward to:</b> ${esc(r.s.look||'')}</p><p><b>Need from Mom/Dad:</b> ${esc(r.s.need||'')}</p><p><b>Best:</b> ${esc(r.s.best||'')}</p><p><b>Improve:</b> ${esc(r.s.improve||'')}</p><p><b>Notes:</b> ${esc(r.s.notes||'')}</p></section>`).join(''):`<section class="card"><p>No saved workout history yet.</p></section>`)}function cleanCell(v){return String(v??'').replace(/[\r\n]+/g,' ').replace(/\|/g,'/').trim()}function dayStorageKey(d){return `alaric.day.w${d.week}.${d.day}`}
function previousSimilarLog(d){let matches=APP.days.filter(x=>x.day===d.day&&Number(x.week)<Number(d.week)).sort((a,b)=>Number(b.week)-Number(a.week));for(const prev of matches){let s=load(dayStorageKey(prev));if(dayDone(s)&&String(s.workoutDifficulty||'').trim())return {d:prev,s};}return null}
function checklistTotalForDay(d){let total=0;(d.blocks||[]).forEach(b=>(b.rows||[]).forEach(r=>{if(r.type==='sets')total+=Number(r.count||0);else if(r.type==='check')total+=1;}));return total}
function checklistDoneForDay(d,s){let done=0;(d.blocks||[]).forEach((b,bi)=>(b.rows||[]).forEach((r,ri)=>{let base=`${bi}_${ri}`;if(r.type==='sets'){for(let i=1;i<=Number(r.count||0);i++)if(s['cb_'+base+'_'+i])done++;}else if(r.type==='check'){if(s['cb_'+base+'_1'])done++;}}));return done}
function completionPctForDay(d,s){let total=checklistTotalForDay(d);return total?Math.round(checklistDoneForDay(d,s)/total*100):0}
function difficultyNum(v){let m=String(v||'').match(/^[1-5]/);return m?Number(m[0]):0}
function adaptiveDecision(d=currentDay()){let prev=previousSimilarLog(d);let normal={pct:0,label:'Normal plan',status:'Normal plan: use the listed numbers',reason:'No previous similar workout is saved yet.',source:'No previous similar workout',prev:null,complete:0,rating:0};if(!prev)return normal;let rating=difficultyNum(prev.s.workoutDifficulty),complete=completionPctForDay(prev.d,prev.s),arm=prev.s.arm||'',legs=prev.s.legs||'',hurt=(arm==='Hurts'||legs==='Hurts'),tired=(arm==='Tired'||legs==='Tired');let pct=0,label='Normal plan',reason=`Previous similar workout: Week ${prev.d.week} ${prev.d.day}. Difficulty ${prev.s.workoutDifficulty||'not rated'}, ${complete}% complete, arm ${arm||'not entered'}, legs ${legs||'not entered'}.`;if(hurt){pct=-15;label='Reduce 15%';reason+=' Soreness gate active: arm or legs marked Hurts.';}else if(rating===5){pct=-15;label='Reduce 15%';reason+=' Max-effort gate active.';}else if(complete<80){pct=0;label='Repeat same numbers';reason+=' Completion gate: below 80%, so do not increase.';}else if((rating===1||rating===2)&&complete<90){pct=0;label='Repeat same numbers';reason+=' Increase gate: need 90%+ completion to bump volume.';}else if((rating===1||rating===2)&&tired){pct=0;label='Repeat same numbers';reason+=' Tired gate: arm/legs marked Tired, so no bump.';}else if(rating===1){pct=10;label='Increase 10%';reason+=' Rule: 1/Easy with 90%+ completion and no soreness = +10%.';}else if(rating===2){pct=5;label='Increase 5%';reason+=' Rule: 2/Manageable with 90%+ completion and no soreness = +5%.';}else if(rating===3){pct=0;label='Normal plan';reason+=' Rule: 3/Challenging = normal listed plan.';}else if(rating===4){pct=0;label='Repeat same numbers';reason+=' Rule: 4/Hard = repeat same numbers.';}else{pct=0;label='Normal plan';reason+=' No usable difficulty number found.';}return {pct,label,status:`${label}: ${pct>0?`add ${pct}% to volume`:pct<0?`cut volume by ${Math.abs(pct)}%`:'use the listed numbers'}`,reason,source:`Week ${prev.d.week} ${prev.d.day}`,prev,complete,rating};}
function roundAdjusted(n,pct,unit){let raw=n*(1+pct/100),u=String(unit||'').toLowerCase();let out=Math.round(raw);if(u.includes('sec')&&n>=20)out=Math.round(raw);if(pct>0&&out<n&&n>=5)out=n+1;if(pct<0&&out>n)out=n-1;return Math.max(1,out)}
function adjustedTargetText(target,pct){if(!pct)return String(target||'');let changed=false;let txt=String(target||'').replace(/(\d+)(\s*(?:controlled reps|quick reps|barrel reps|clean reps|scored swings|two-strike swings|swings|reps|rep|rounds|round|seconds|second|sec|total))/gi,(m,num,unit)=>{changed=true;return String(roundAdjusted(Number(num),pct,unit))+unit;});return changed?txt:String(target||'')}

function formatLocalTime(dt){return dt.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}function formatLocalDateTime(dt){return dt.toLocaleString([], {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}function formatTimeInput(t){let m=String(t||'').match(/^(\d{1,2}):(\d{2})/);if(!m)return '';let d=new Date(2000,0,1,Number(m[1]),Number(m[2]));return formatLocalTime(d)}function estimateDuration(startTime,endDate){let m=String(startTime||'').match(/^(\d{1,2}):(\d{2})/);if(!m)return '';let start=new Date(endDate);start.setHours(Number(m[1]),Number(m[2]),0,0);let diff=endDate-start;if(diff<0)diff+=24*60*60*1000;let mins=Math.max(0,Math.round(diff/60000)),h=Math.floor(mins/60),r=mins%60;if(h&&r)return `${h} hr ${r} min`;if(h)return `${h} hr`;return `${r} min`}function checklist(d,s){let out=[];d.blocks.forEach((b,bi)=>{out.push('- '+b.title);b.rows.forEach((r,ri)=>{let base=`${bi}_${ri}`;if(r.type==='sets'){let done=[];for(let i=1;i<=r.count;i++)done.push(s['cb_'+base+'_'+i]?`S${i}: done`:`S${i}: not done`);out.push(`  • ${r.name}: ${effectiveTargetText(r)} (${done.join(', ')})`)}else if(r.type==='score'){out.push(`  • ${r.name}: ${effectiveTargetText(r)}; result: ${s['score_'+base]||'not entered'}`)}else{out.push(`  • ${r.name}: ${effectiveTargetText(r)}; ${s['cb_'+base+'_1']?'done':'not done'}${s['score_'+base]?'; actual: '+s['score_'+base]:''}`)}})});return out.join('\n')}function summaryText(){saveDay(false);let d=currentDay(),s=load(keyDay());return[`Alaric Training Results`,`Week ${d.week} (${d.dates}) - ${d.day}`,`Workout: ${d.title}`,`Phase: ${d.phase}`,`Weekly target: ${d.weekTarget}`,`Friday goal: ${d.weekFridayGoal}`,'',`Workout Timing`,`Workout start: ${formatTimeInput(s.workoutStartTime)||'not entered'}`,`Results sent: ${s.workoutCompletedDisplay||'not sent yet'}`,`Estimated session length: ${s.workoutEstimatedDuration||'not calculated'}`,`Workout difficulty: ${s.workoutDifficulty||'not rated'}`,'',`Check-in`,`Energy: ${s.energy||'not entered'}`,`Arm: ${s.arm||'not entered'} | Legs: ${s.legs||'not entered'} | Mood: ${s.mood||'not entered'}`,`What did you eat today?: ${s.food||s.fuel||''}`,`How much water have you had today?: ${s.water||''}`,`Today's focus: ${s.focusInput||''}`,`Looking forward to: ${s.look||''}`,`Need from Mom/Dad: ${s.need||''}`,'',`Finish / Notes`,`Best rep or score: ${s.best||''}`,`One thing to improve: ${s.improve||''}`,`Notes: ${s.notes||''}`,'',`Checklist`,checklist(d,s)].join('\n')}function emailSummary(){saveDay(false);let s=load(keyDay());if(!checkinComplete(s)){alert('Complete the athlete check-in first. Use “nothing today” if no help is needed from Mom/Dad.');return}if(!String(s.workoutDifficulty||'').trim()){alert('Rate the workout difficulty before sending results.');return}let sentAt=new Date();s.workoutCompletedAt=sentAt.toISOString();s.workoutCompletedTime=formatLocalTime(sentAt);s.workoutCompletedDisplay=formatLocalDateTime(sentAt);s.workoutEstimatedDuration=estimateDuration(s.workoutStartTime,sentAt);save(keyDay(),s);let g=load(gkey),to=encodeURIComponent(g.parentEmail||''),subject=encodeURIComponent(`Alaric training results - Week ${selectedWeek} ${selectedDay}`),body=encodeURIComponent(summaryText());window.location.href=`mailto:${to}?subject=${subject}&body=${body}`}function copyHistory(){let rows=[];APP.days.forEach(d=>{let s=load(`alaric.day.w${d.week}.${d.day}`);if(dayDone(s))rows.push(`Week ${d.week} ${d.day}: ${d.title}\nEnergy ${s.energy||''}, Arm ${s.arm||''}, Legs ${s.legs||''}, Mood ${s.mood||''}\nTiming: ${formatTimeInput(s.workoutStartTime)||'not entered'} → ${s.workoutCompletedTime||'not sent'}; Estimated: ${s.workoutEstimatedDuration||'not calculated'}\nDifficulty: ${s.workoutDifficulty||'not rated'}\nFood: ${s.food||s.fuel||''}\nWater: ${s.water||''}\nBest: ${s.best||''}\nImprove: ${s.improve||''}\nNotes: ${s.notes||''}\n`)});navigator.clipboard?.writeText(rows.join('\n')).then(()=>alert('History summary copied.')).catch(()=>alert('Could not copy automatically.'))}todayDefault();render();
